spring.application.name=erp-toppower
server.port=8081
# Importa variáveis de ambiente do arquivo .env na raiz do projeto.
# O .env é ignorado pelo git; copie .env.example -> .env e ajuste os valores.
spring.config.import=optional:file:.env[.properties]

## TERMINAL
spring.output.ansi.enabled=ALWAYS

## LOCALE
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# Migrations SQL manuais (executadas antes do Hibernate)
# Os scripts abaixo são executados na ordem listada antes do Hibernate
# (graças a `spring.jpa.defer-datasource-initialization=true`):
#   V1 — DROP da tabela legada `clients` (módulo client foi refatorado em
#        `Company` + `Customer`).
#   V2 — Ajustes para auto-geração de códigos:
#        * `products.code` passa a aceitar NULL (SKU opcional);
#        * backfill de `companies.code` para o padrão `EMP000001`;
#        * backfill de `customers.code` para o padrão `CLI000001`.
#   V3 — `quotations.number` deixa de ser VARCHAR(50) (formato QUO001500)
#        e passa a ser BIGINT (numeração simples 1500, 1501, ...).
#        Linhas pré-existentes no formato antigo são removidas (incompatíveis).
#   V4 — `companies.state_registration_exempt` (IE Isento) — campo booleano
#        para indicar que a empresa é dispensada de Inscrição Estadual.
#   V5 — Seed de dados inicial: reproduz no banco os mesmos registros que
#        existiam como mocks no frontend (carriers, companies, customers,
#        sellers, products, quotations e quotation_items). Idempotente.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:db/migration/V1__drop_old_clients_table.sql,classpath:db/migration/V2__auto_generate_codes_and_nullable_product_sku.sql,classpath:db/migration/V3__change_quotation_number_to_bigint.sql,classpath:db/migration/V4__add_company_state_registration_exempt.sql,classpath:db/migration/V5__seed_initial_data.sql

# MySQL Database Connection Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:erp-toppower-api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JWT (autenticacao)
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
## SPRINGDOC OPENAPI / SWAGGER UI
# Caminho do JSON gerado com a especificação OpenAPI
springdoc.api-docs.path=/v3/api-docs
# Habilita o Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Agrupa as operações por tag e mantém o esquema Bearer JWT sempre visível
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
# Pacotes que serão escaneados para popular o /v3/api-docs
springdoc.packages-to-scan=br.com.toppower.erp_toppower
# Caminhos que serão filtrados
springdoc.paths-to-match=/api/v1/**

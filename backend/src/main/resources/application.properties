spring.application.name=erp-toppower
server.port=8081
# Importa variáveis de ambiente do arquivo .env na raiz do projeto.
# O .env é ignorado pelo git; copie .env.example -> .env e ajuste os valores.
spring.config.import=optional:file:.env[.properties]

## TERMINAL
spring.output.ansi.enabled=ALWAYS

## LOCALE
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
# `update` (em vez de `create-drop`) preserva os dados entre reinícios.
# Necessário para que a base local de CEPs (~900k registros) carregada via
# `POST /api/v1/ceps/import` não seja descartada a cada boot.
# A migration V1 (idempotente) roda a cada boot e complementa índices/seed.
spring.jpa.hibernate.ddl-auto=update

# Migrations SQL manuais (executadas antes do Hibernate)
#
# spring.sql.init.mode=always roda TODOS os scripts listados abaixo em cada
# boot, por isso as migrations devem ser idempotentes (guards via
# INFORMATION_SCHEMA + PREPARE/EXECUTE). O Hibernate (ddl-auto=update) cria
# todas as tabelas/colunas/índices declarados nas entidades (@Index,
# @UniqueConstraint); a migration V1 complementa apenas índices em
# organization_id (filtro multi-tenant), unique constraints de domínio não
# declaradas nas entidades, índices auxiliares de boletos/products e o seed
# das duas organizations Top Power.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:db/migration/V1__init.sql,classpath:db/migration/V2__supplier_email_nullable.sql,classpath:db/migration/V3__drop_boletos_description_unique.sql,classpath:db/migration/V4__nfe_access_key_and_product_supplier_codes.sql,classpath:db/migration/V5__boleto_contract_work_and_registration.sql,classpath:db/migration/V6__service_template_category_id.sql,classpath:db/migration/V7__boleto_refactor_fields.sql,classpath:db/migration/V8__boleto_drop_payee_registration_date.sql,classpath:db/migration/V9__boleto_installment_plan_id.sql

# MySQL Database Connection Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:erp-toppower-api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =====================================================================
# Base local de CEPs (lookup offline, sem API externa)
# =====================================================================
# Caminho do CSV de CEPs. Por default aponta para o arquivo embarcado
# no classpath (src/main/resources/cep/ceps_brasil.csv, ~850k registros,
# formato TSV: cep<TAB>state<TAB>city<TAB>neighborhood<TAB>street, sem
# header, UTF-8). Pode ser sobrescrito via CEP_CSV_PATH para apontar
# um CSV no filesystem (ex.: base CEP Aberto com lat/lon).
# Formatos suportados (deteccao automatica):
#   1) TSV sem header:  cep<TAB>state<TAB>city<TAB>neighborhood<TAB>street
#   2) CSV com header:   cep;state;city;neighborhood;street[;latitude;longitude]
#      (sinonimos aceitos: logradouro/rua/street->street, uf/estado/state->state, etc.)
app.cep.import.csv-path=${CEP_CSV_PATH:classpath:cep/ceps_brasil.csv}
# Tamanho do lote para INSERT IGNORE em massa (~850k linhas em ~30-60s).
app.cep.import.batch-size=${CEP_BATCH_SIZE:1000}
# Auto-importa a base embarcada de CEPs no boot quando a tabela `ceps`
# estiver vazia. Default true — dispensa o admin de chamar manualmente
# POST /api/v1/ceps/import após instalar o sistema. Em base já populada
# é no-op. Defina CEP_AUTO_IMPORT=false para desabilitar.
app.cep.import.auto=${CEP_AUTO_IMPORT:true}

# JWT (autenticacao)
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
## SPRINGDOC OPENAPI / SWAGGER UI
# Caminho do JSON gerado com a especificação OpenAPI
springdoc.api-docs.path=/v3/api-docs
# Habilita o Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Agrupa as operações por tag e mantém o esquema Bearer JWT sempre visível
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
# Pacotes que serão escaneados para popular o /v3/api-docs
springdoc.packages-to-scan=br.com.toppower.erp_toppower
# Caminhos que serão filtrados
springdoc.paths-to-match=/api/v1/**

# =====================================================================
# Uploads (logo das Organizations) — arquivos locais servidos em
# /logos/** pelo WebMvcConfig.
# =====================================================================
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}
# Tipos MIME aceitos para upload de logo.
app.uploads.logo.allowed-content-types=image/png,image/jpeg
# Tipos MIME aceitos para anexo de boleto (PDF + imagens).
app.uploads.attachment.allowed-content-types=application/pdf,image/png,image/jpeg
# Tamanho máximo de upload (logos e anexos de boleto). PDFs podem ser maiores.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

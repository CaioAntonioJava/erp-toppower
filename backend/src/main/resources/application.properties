spring.application.name=erp-toppower
server.port=8081
# Importa variáveis de ambiente do arquivo .env na raiz do projeto.
# O .env é ignorado pelo git; copie .env.example -> .env e ajuste os valores.
spring.config.import=optional:file:.env[.properties]

## TERMINAL
spring.output.ansi.enabled=ALWAYS

## LOCALE
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
# `update` (em vez de `create-drop`) preserva os dados entre reinícios.
# Necessário para que a base local de CEPs (~900k registros) carregada via
# `POST /api/v1/ceps/import` não seja descartada a cada boot.
# As migrations V1-V5 continuam idempotentes e rodam normalmente.
spring.jpa.hibernate.ddl-auto=update

# Migrations SQL manuais (executadas antes do Hibernate)
#
# NOTA: spring.sql.init.mode=always roda TODOS os scripts listados abaixo em
# cada boot. NÃO incluir aqui migrations destrutivas/one-shot — ex.: a
# V15__drop_carriers.sql faz DROP TABLE carriers a cada boot, apagando as
# transportadoras cadastradas. Ela foi removida da lista por isso. A V17
# (CREATE TABLE IF NOT EXISTS) é idempotente e permanece. A coluna
# organization_uuid de carriers foi removida pela V21 (Carrier hoje é dado
# global, sem isolamento por org), então a V20 que a adicionava também saiu.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:db/migration/V1__init.sql,classpath:db/migration/V2__technical_proposal_service_item_description_text.sql,classpath:db/migration/V3__service_template_description_text.sql,classpath:db/migration/V4__create_technical_proposal_conditions.sql,classpath:db/migration/V5__add_general_price_to_technical_proposal.sql,classpath:db/migration/V6__add_category_and_template_to_service_item.sql,classpath:db/migration/V7__create_boletos.sql,classpath:db/migration/V8__create_boleto_attachments.sql,classpath:db/migration/V9__add_product_fiscal_fields.sql,classpath:db/migration/V10__create_contracts.sql,classpath:db/migration/V11__add_client_fields_to_contracts.sql,classpath:db/migration/V12__create_contract_clauses.sql,classpath:db/migration/V13__drop_contract_legacy_columns.sql,classpath:db/migration/V14__drop_contract_clause_description.sql,classpath:db/migration/V15__add_price_to_contracts.sql,classpath:db/migration/V16__add_delivery_date_to_contracts.sql,classpath:db/migration/V17__create_receivables.sql,classpath:db/migration/V18__migrate_product_unit_to_sefaz.sql,classpath:db/migration/V19__sales_order_code.sql,classpath:db/migration/V20__receivable_payment_condition_enum.sql,classpath:db/migration/V21__drop_sales_order_number.sql,classpath:db/migration/V22__replace_item_discount_with_margin.sql,classpath:db/migration/V23__rename_boletos_document_number_to_description.sql,classpath:db/migration/V24__add_payment_condition_to_contracts.sql,classpath:db/migration/V25__create_payables.sql,classpath:db/migration/V26__add_supplier_to_boletos.sql

# MySQL Database Connection Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:erp-toppower-api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =====================================================================
# Base local de CEPs (lookup offline, sem API externa)
# =====================================================================
# Caminho do CSV de CEPs. Por default aponta para o arquivo embarcado
# no classpath (src/main/resources/cep/ceps_brasil.csv, ~850k registros,
# formato TSV: cep<TAB>state<TAB>city<TAB>neighborhood<TAB>street, sem
# header, UTF-8). Pode ser sobrescrito via CEP_CSV_PATH para apontar
# um CSV no filesystem (ex.: base CEP Aberto com lat/lon).
# Formatos suportados (deteccao automatica):
#   1) TSV sem header:  cep<TAB>state<TAB>city<TAB>neighborhood<TAB>street
#   2) CSV com header:   cep;state;city;neighborhood;street[;latitude;longitude]
#      (sinonimos aceitos: logradouro/rua/street->street, uf/estado/state->state, etc.)
app.cep.import.csv-path=${CEP_CSV_PATH:classpath:cep/ceps_brasil.csv}
# Tamanho do lote para INSERT IGNORE em massa (~850k linhas em ~30-60s).
app.cep.import.batch-size=${CEP_BATCH_SIZE:1000}
# Auto-importa a base embarcada de CEPs no boot quando a tabela `ceps`
# estiver vazia. Default true — dispensa o admin de chamar manualmente
# POST /api/v1/ceps/import após instalar o sistema. Em base já populada
# é no-op. Defina CEP_AUTO_IMPORT=false para desabilitar.
app.cep.import.auto=${CEP_AUTO_IMPORT:true}

# JWT (autenticacao)
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
## SPRINGDOC OPENAPI / SWAGGER UI
# Caminho do JSON gerado com a especificação OpenAPI
springdoc.api-docs.path=/v3/api-docs
# Habilita o Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Agrupa as operações por tag e mantém o esquema Bearer JWT sempre visível
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
# Pacotes que serão escaneados para popular o /v3/api-docs
springdoc.packages-to-scan=br.com.toppower.erp_toppower
# Caminhos que serão filtrados
springdoc.paths-to-match=/api/v1/**

# =====================================================================
# Uploads (logo das Organizations) — arquivos locais servidos em
# /logos/** pelo WebMvcConfig.
# =====================================================================
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}
# Tipos MIME aceitos para upload de logo.
app.uploads.logo.allowed-content-types=image/png,image/jpeg
# Tipos MIME aceitos para anexo de boleto (PDF + imagens).
app.uploads.attachment.allowed-content-types=application/pdf,image/png,image/jpeg
# Tamanho máximo de upload (logos e anexos de boleto). PDFs podem ser maiores.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

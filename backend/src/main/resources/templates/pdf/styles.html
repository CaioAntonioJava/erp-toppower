<!--
  CSS compartilhado entre todos os templates de PDF. Incluído via
  <style th:replace="~{pdf/styles :: shared}"></style> no <head>
  de cada template.
-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="shared">
  <style type="text/css">
    @page {
      size: A4;
      margin: 1.5cm 1.5cm 2cm 1.5cm;
      @bottom-center {
        content: "Página " counter(page) " de " counter(pages);
        font-family: Helvetica, Arial, sans-serif;
        font-size: 8pt;
        color: #94a3b8;
      }
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 10pt;
      color: #0f172a;
      line-height: 1.4;
    }

    table { border-collapse: collapse; }

    .doc-title {
      font-size: 14pt;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 14px;
    }

    .doc-subtitle {
      font-size: 9pt;
      color: #64748b;
      margin-top: 4px;
    }

    .section {
      margin-top: 18px;
      page-break-inside: avoid;
    }

    .section-title {
      font-size: 9pt;
      font-weight: bold;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    table.kv {
      width: 100%;
    }
    table.kv td {
      padding: 3px 6px;
      vertical-align: top;
    }
    table.kv td.k {
      width: 22%;
      font-size: 8pt;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    table.kv td.v {
      width: 28%;
      font-weight: bold;
    }

    table.grid {
      width: 100%;
      border-collapse: collapse;
    }
    table.grid thead th {
      text-align: left;
      font-size: 8pt;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 4px;
      border-bottom: 1px solid #cbd5e1;
    }
    table.grid tbody td {
      padding: 6px 4px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 9pt;
    }
    table.grid tbody tr:last-child td {
      border-bottom: 1px solid #cbd5e1;
    }

    .num { text-align: right; }
    .money { font-family: "Courier New", monospace; }

    .totals {
      margin-top: 16px;
      width: 100%;
      display: table;
    }
    .totals table {
      width: 50%;
      margin-left: auto;
      border-collapse: collapse;
    }
    .totals td {
      padding: 4px 6px;
      font-size: 9pt;
    }
    .totals td:first-child {
      color: #475569;
    }
    .totals tr.grand td {
      font-size: 11pt;
      font-weight: bold;
      border-top: 1px solid #0f172a;
      padding-top: 6px;
    }

    .notes {
      font-size: 9pt;
      color: #334155;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .signatures {
      margin-top: 60px;
      width: 100%;
      display: table;
    }
    .sig {
      width: 45%;
      display: inline-block;
      text-align: center;
      vertical-align: top;
      margin: 0 2%;
    }
    .sig-line {
      border-top: 1px solid #475569;
      margin-bottom: 4px;
    }
    .sig-label {
      font-size: 8pt;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sig-name {
      font-size: 9pt;
      font-weight: bold;
      color: #0f172a;
      margin-top: 2px;
    }

    .footer {
      position: fixed;
      bottom: -1cm;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 8pt;
      color: #94a3b8;
    }
  </style>
</th:block>

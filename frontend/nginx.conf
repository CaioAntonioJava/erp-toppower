# ============================================================
# nginx — serve o frontend SPA e faz proxy /api -> backend
# ============================================================
server {
    listen 80;
    server_name _;

    # Estáticos do Vite (build em /usr/share/nginx/html)
    root /usr/share/nginx/html;
    index index.html;

    # Tamanho máximo de upload (logos) — igual ao backend (2MB).
    client_max_body_size 2m;

    # Proxy das chamadas da API para o container "backend" na rede do compose.
    location /api/ {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback: qualquer rota desconhecida serve o index.html
    # (necessário para react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
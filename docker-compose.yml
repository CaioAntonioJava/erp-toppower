# ============================================================
# ERP TopPower — orquestração completa (bd + backend + frontend)
# Uso:
#   1) copie .env.example -> .env  e ajuste as senhas/secrets
#   2) docker compose up -d --build
# Acesse:
#   - Frontend:  http://localhost:8080
#   - Backend:   http://localhost:8081  (Swagger: /swagger-ui.html)
#   - MySQL:     localhost:3306
# ============================================================

services:
  db:
    image: mysql:8.0
    container_name: erp-toppower-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-erp-toppower-api}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      # Encoding/collation necessárias para pt_BR (acentuação).
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-toppower-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Banco
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erp-toppower-api}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-changeme-gere-um-secret-seguro-com-openssl-rand-base64-48}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # Uploads de logos
      APP_UPLOADS_DIR: /app/uploads
    ports:
      - "8081:8081"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - erp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vazio: os módulos em src/api já chamam /api/v1/... e o nginx
        # faz proxy same-origin. Preencher com /api duplicaria o prefixo
        # (/api/api/v1/...) e o backend responderia 403.
        VITE_API_URL: ""
    container_name: erp-toppower-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - erp-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  erp-net:
    driver: bridge